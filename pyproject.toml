[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurlex-cli"
version = "0.1.0"
description = "Exact-source EU law retrieval from CELLAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<1", "httpx>=0.27,<1", "typer>=0.12,<1"]

[project.scripts]
eurlex = "eurlex_cli.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/eurlex_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
